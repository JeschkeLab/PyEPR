[project]
name = "pyEPR-ESR"
version = "1.1"
description = ""
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "Hugo Karas", email = "hkaras@ethz.ch" },
    { name = "Gunnar Jeschke", email = "gjeschke@eth.ch" },
    { name = "Stefan Stoll", email = "stst@uw.edu" },
]
dependencies = [
    "numpy>=2.1,<3.0",
    "scipy>=1.14.1",
    "matplotlib>=3.9.2",
    "pyyaml>=6.0.2,<7.0.0",
    "xarray>=2025",
    "h5py>3.15",
    "h5netcdf>1.4.0",
    "toml>=0.10.2",
    "deerlab>=1.1.4,<2.0",
    "psutil>=7.1.3",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "gitpython>=3.1.43,<4.0.0",
    "pytest>=8.3.3,<9.0.0",
]
doc = [
    "furo>=2024.8.6",
    "autoapi>=2.0.1",
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.3.3",
    "sphinx-toolbox>=3.8.1",
    "sphinx-copybutton>=0.5.2",
    "numpydoc>=1.8.0",
    "sphinx-favicon>=1.0.1",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-gallery>=0.19.0",
    "myst-parser>=4.0.1",
    "sphinx-design>=0.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyepr"]
